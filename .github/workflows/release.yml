name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image already ships the Android SDK with accepted
      # licenses. android-actions/setup-android@v3 fails on newer images
      # (sdkmanager: Failed to find package 'tools'), so point Gradle at the
      # preinstalled SDK instead of installing anything.
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Android SDK not found"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          ls "$SDK/platforms" | tail -n 3

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ONYX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ONYX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONYX_KEY_ALIAS || 'onyx' }}
          KEY_PASSWORD: ${{ secrets.ONYX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/onyx-release.jks
          {
            echo "storeFile=keystore/onyx-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        # The repo is checked out on Windows, so the gradlew exec bit is lost.
        run: bash ./gradlew :app:assembleRelease --console=plain

      - name: Build update manifest
        id: manifest
        run: |
          set -euo pipefail
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          CODE=$(python3 - "$VERSION" <<'PY'
          import sys
          parts = [int(p) for p in sys.argv[1].split(".")]
          print(parts[0] * 1_000_000 + parts[1] * 1_000 + parts[2])
          PY
          )
          APK=app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > android.json <<EOF
          {
            "versionName": "$VERSION",
            "versionCode": $CODE,
            "url": "https://github.com/${{ github.repository }}/releases/download/v$VERSION/app-release.apk",
            "sha256": "$SHA",
            "notes": "ONYX $VERSION",
            "minSdk": 31
          }
          EOF
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: ONYX ${{ steps.manifest.outputs.version }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            android.json
          generate_release_notes: true
