[package]
name = "onyx-desktop"
version = "0.9.5"
description = "ONYX — music player and control center"
edition = "2021"
rust-version = "1.77"

[lib]
name = "onyx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.25"
base64 = "0.23"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "multipart"] }
wait-timeout = "0.2"
tiny_http = "0.12"
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes"] }
